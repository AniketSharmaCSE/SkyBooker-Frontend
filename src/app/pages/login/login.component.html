<section class="auth-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="sky-card-glass fade-in-up">
          <!-- Tab header -->
          <div class="auth-tabs mb-4">
            <a routerLink="/login" class="auth-tab active">Log In</a>
            <a routerLink="/register" class="auth-tab">Sign Up</a>
          </div>

          <div class="mb-4">
            <h4 class="fw-bold mb-1" style="color: var(--sky-text);">Welcome back</h4>
            <p class="small" style="color: var(--sky-muted);">Log in to your account to continue</p>
          </div>

          <div *ngIf="error" class="sky-alert sky-alert-error mb-3">
            <svg class="sky-icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ error }}
          </div>

          <form (ngSubmit)="login()">
            <div class="mb-3">
              <input type="email" class="sky-input" placeholder="Email Address"
                     [(ngModel)]="email" name="email" required id="login-email">
            </div>
            <div class="mb-4">
              <div class="input-icon-wrap">
                <input [type]="showPassword ? 'text' : 'password'" class="sky-input with-eye" placeholder="Password"
                       [(ngModel)]="password" name="password" required id="login-password">
                <button type="button" class="eye-btn" (click)="showPassword = !showPassword" tabindex="-1" aria-label="Toggle password">
                  <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-icon"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="btn-sky w-100 py-3" [disabled]="loading" id="btn-login">
              <span *ngIf="!loading">Log In</span>
              <span *ngIf="!loading" style="margin-left: 0.3rem;">→</span>
              <span *ngIf="loading" class="sky-spinner" style="width:1.2rem;height:1.2rem;border-width:2px;"></span>
            </button>
          </form>

          <p class="text-center mt-4 mb-0 small" style="color: var(--sky-muted);">
            Don't have an account?
            <a routerLink="/register" class="text-decoration-none fw-600" style="color: var(--sky-orange);">Sign up</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
