<div class="page-header">
  <div class="container">
    <h1>
      <img src="assets/svgs/notification.svg" class="page-header-icon" alt="notifications">
      Notifications
    </h1>
  </div>
</div>

<div class="container section-padding" style="padding-top: 0;">
  <div *ngIf="loading" class="text-center py-5"><div class="sky-spinner"></div></div>

  <div *ngIf="!loading && notifications.length === 0" class="text-center py-5">
    <div><img src="assets/svgs/notification.svg" class="sky-icon-lg" alt="no notification"></div>
    <h4 class="mt-3 fw-bold">No notifications</h4>
    <p class="text-muted">You're all caught up!</p>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div *ngFor="let n of notifications; let i = index"
           class="notif-card sky-card mb-3 fade-in-up"
           [class.notif-unread]="!n.isRead"
           [style.animation-delay]="(i*0.06)+'s'"
           (click)="markRead(n.id)">
        <div class="d-flex justify-content-between align-items-start">
          <div class="d-flex align-items-start gap-3">
            <div class="notif-icon-wrap">
              <img src="assets/svgs/notification.svg" class="notif-icon-img" alt="notification">
            </div>
            <div>
              <div class="notif-title fw-bold">
                <span *ngIf="!n.isRead" class="unread-dot"></span>
                {{ n.title }}
              </div>
              <div class="notif-message text-muted small mt-1">{{ n.message }}</div>
            </div>
          </div>
          <div class="notif-time text-muted small text-nowrap ms-3">{{ formatDate(n.createdAt) }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
